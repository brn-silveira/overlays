<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Importantes | Meu GitHub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --heading-color: #f0f6fc;
            --accent-color: #58a6ff;
            --hover-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--heading-color);
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .link-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item a {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--bg-color);
            color: var(--heading-color);
            text-decoration: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .link-item a:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.85rem;
            color: #8b949e;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Meus Links</h1>
            <p class="subtitle">Acesse meus projetos e redes sociais abaixo</p>
        </header>

        <main>
            <ul class="link-list">
                <li class="link-item">
                    <a href="https://brn-silveira.github.io/overlays/background.html" target="_blank" rel="noopener noreferrer">Background</a>
                </li>
                <li class="link-item">
                    <a href="" target="_blank" rel="noopener noreferrer">Link 02 (Ajuste aqui)</a>
                </li>
                <li class="link-item">
                    <a href="" target="_blank" rel="noopener noreferrer">Link 03 (Ajuste aqui)</a>
                </li>
                <li class="link-item">
                    <a href="" target="_blank" rel="noopener noreferrer">Link 04 (Ajuste aqui)</a>
                </li>
                <li class="link-item">
                    <a href="" target="_blank" rel="noopener noreferrer">Link 05 (Ajuste aqui)</a>
                </li>
            </ul>
        </main>

        <footer>
            <p>&copy; 2026 - Todos os direitos reservados</p>
        </footer>
    </div>

</body>
</html>
